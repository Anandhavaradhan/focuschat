name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ci/debug.keystore is a throwaway DEBUG key, committed on purpose so every CI build
      # has the same SHA-1 (registered in Firebase for Google sign-in). Never use it for a
      # release or Play Store build: release signing reads KEYSTORE_PATH, STORE_PASSWORD and
      # KEY_PASSWORD (see app/build.gradle.kts), and that key stays out of the repo.
      - name: Use fixed debug key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Write .env
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: focuschat-apk
          path: app/build/outputs/apk/debug/*.apk
