name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Write .env
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Print SHA-1
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          $AS verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i digest || true
      - uses: actions/upload-artifact@v4
        with:
          name: focuschat-apk
          path: app/build/outputs/apk/debug/*.apk
