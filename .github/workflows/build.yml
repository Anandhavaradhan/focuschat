name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write   # to publish the APK as a release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ci/debug.keystore is a throwaway DEBUG key, committed on purpose so every CI build
      # has the same SHA-1 (registered in Firebase for Google sign-in). Never use it for a
      # release or Play Store build: release signing reads KEYSTORE_PATH, STORE_PASSWORD and
      # KEY_PASSWORD (see app/build.gradle.kts), and that key stays out of the repo.
      - name: Use fixed debug key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Write .env
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: focuschat-apk
          path: app/build/outputs/apk/debug/*.apk
      # The newest APK is always at:
      #   https://github.com/<owner>/focuschat/releases/download/focuschat-latest/FocusChat.apk
      # (the repo is private, so you must be signed in to GitHub to download it)
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk FocusChat.apk
          gh release delete focuschat-latest --repo "${{ github.repository }}" --cleanup-tag --yes || true
          sleep 5
          gh release create focuschat-latest FocusChat.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "FocusChat (build ${{ github.run_number }})" \
            --notes "Download FocusChat.apk, open it on the phone and allow installing from this source."
